<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Easy Squawk: know which stocks a headline will move</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --ink:#101B33; --muted:#55607A; --line:#D3DBE7;
  --up:#0B8A66; --up-bg:#DDF3EA; --down:#C93A3A; --down-bg:#F8E1E1; --flat:#8A6A12; --flat-bg:#F5EBCB;
  --brand:#2F5BFF; --brand-ink:#FFFFFF;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D1424; --surface:#151E33; --ink:#E9EEF9; --muted:#9AA6C0; --line:#26314B;
    --up:#3DD6A3; --up-bg:#123A31; --down:#FF7A7A; --down-bg:#3F1B22; --flat:#E8C55B; --flat-bg:#3A3117;
    --brand:#6C8CFF; --brand-ink:#0D1424;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1424; --surface:#151E33; --ink:#E9EEF9; --muted:#9AA6C0; --line:#26314B;
  --up:#3DD6A3; --up-bg:#123A31; --down:#FF7A7A; --down-bg:#3F1B22; --flat:#E8C55B; --flat-bg:#3A3117;
  --brand:#6C8CFF; --brand-ink:#0D1424;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,system-ui,sans-serif;line-height:1.05;margin:0;letter-spacing:-.02em}
a{color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:6px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
nav{display:flex;justify-content:space-between;align-items:center;padding:22px 0}
.logo{font:800 22px "Bricolage Grotesque",sans-serif;text-decoration:none;display:flex;align-items:center;gap:8px}
.logo svg{width:28px;height:28px}
.btn{display:inline-block;background:var(--brand);color:var(--brand-ink);font-weight:600;padding:13px 22px;border-radius:10px;border:0;text-decoration:none;cursor:pointer;font-size:16px;font-family:inherit}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn:hover{filter:brightness(1.08)}

/* hero */
.hero{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center;padding:48px 0 88px}
.hero h1{font-size:clamp(40px,6vw,68px);font-weight:800}
.hero p.lead{font-size:20px;color:var(--muted);max-width:30em;margin:22px 0 30px}
.cta-row{display:flex;gap:12px;flex-wrap:wrap}
.fine{font-size:14px;color:var(--muted);margin-top:16px}

/* signal card */
.signal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 20px 50px -24px rgba(16,27,51,.35)}
.src{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}
.signal h3{font-size:21px;line-height:1.2;letter-spacing:-.01em}
.sum{font-size:15px;color:var(--muted);margin:10px 0 18px;padding-left:12px;border-left:3px solid var(--brand)}
.row{display:grid;grid-template-columns:64px 1fr 84px;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.tk{font:700 16px "Bricolage Grotesque",sans-serif}
.tk small{display:block;font:400 12px Figtree,sans-serif;color:var(--muted)}
.bar{height:10px;background:var(--line);border-radius:6px;position:relative;overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;border-radius:6px;width:0;animation:fill 1.1s .3s cubic-bezier(.2,.8,.2,1) forwards}
.bar.pos i{left:50%;background:var(--up);--w:var(--v)}
.bar.neg i{right:50%;background:var(--down);--w:var(--v)}
